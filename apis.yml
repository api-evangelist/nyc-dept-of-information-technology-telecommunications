aid: nyc-dept-of-information-technology-telecommunications

name: NYC Dept. of Information Technology & Telecommunications

description: 'The NYC Department of Information Technology & Telecommunications (DoITT) is the municipal agency responsible for providing technology services, digital infrastructure, and innovative solutions to New York City government agencies and residents. It oversees the development and maintenance of citywide IT systems, data platforms, and public-facing digital services, aiming to improve efficiency, transparency, and citizen engagement across the city.'

